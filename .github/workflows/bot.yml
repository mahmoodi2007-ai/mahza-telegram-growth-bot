import os
import logging
from datetime import datetime, timezone

from telegram import Update, InlineKeyboardButton, InlineKeyboardMarkup
from telegram.ext import Application, CommandHandler, ContextTypes


# ============================================================
# Configuration
# ============================================================

BOT_TOKEN = os.getenv("BOT_TOKEN")

CHANNEL_URL = "https://t.me/MahzaCollection"
WEBSITE_URL = "https://mahzacollection.ir"


# ============================================================
# Logging
# ============================================================

logging.basicConfig(
    format="%(asctime)s - %(name)s - %(levelname)s - %(message)s",
    level=logging.INFO,
)

logger = logging.getLogger(__name__)


# ============================================================
# /start
# ============================================================

async def start(update: Update, context: ContextTypes.DEFAULT_TYPE):

    user = update.effective_user

    # --------------------------------------------------------
    # دریافت کد منبع ورود
    # مثال:
    # /start instagram
    # /start website
    # /start campaign1
    # --------------------------------------------------------

    source = "direct"

    if context.args:
        source = context.args[0].strip().lower()

    username = user.username if user.username else "بدون_username"
    user_id = user.id

    now = datetime.now(timezone.utc).isoformat()

    logger.info(
        "NEW USER | user_id=%s | username=%s | source=%s | time=%s",
        user_id,
        username,
        source,
        now,
    )

    # --------------------------------------------------------
    # دکمه‌ها
    # --------------------------------------------------------

    keyboard = [
        [
            InlineKeyboardButton(
                "🛍 ورود به سایت مهزا",
                url=WEBSITE_URL
            )
        ],
        [
            InlineKeyboardButton(
                "📢 عضویت در کانال مهزا",
                url=CHANNEL_URL
            )
        ],
    ]

    reply_markup = InlineKeyboardMarkup(keyboard)

    # --------------------------------------------------------
    # پیام خوش‌آمدگویی
    # --------------------------------------------------------

    await update.message.reply_text(
        "سلام 🌷\n"
        "به ربات Mahza Collection خوش آمدید. 🛍✨\n\n"
        "اینجا می‌توانید جدیدترین محصولات، "
        "تخفیف‌ها و پیشنهادهای مهزا کالکشن را دنبال کنید.\n\n"
        "برای ورود به سایت یا عضویت در کانال، "
        "یکی از گزینه‌های زیر را انتخاب کنید:",
        reply_markup=reply_markup,
    )


# ============================================================
# Main
# ============================================================

def main():

    if not BOT_TOKEN:
        raise ValueError("BOT_TOKEN تنظیم نشده است.")

    application = Application.builder().token(BOT_TOKEN).build()

    application.add_handler(
        CommandHandler("start", start)
    )

    print("Mahza Collection Growth Bot is running...")

    application.run_polling()


# ============================================================
# Run
# ============================================================

if __name__ == "__main__":
    main()
